# SPDX-License-Identifier: MPL-2.0
# A test build's packages (from a "Build and attest firmware" run on main) on the test-build branch, one commit, replaced
# each time: a way to fetch a build for trying on hardware without a release.
name: Test build to branch

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The build's run id
        required: true

permissions:
  contents: write
  actions: read

jobs:
  copy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: packages
      - name: Commit to test-build
        run: |
          set -euo pipefail
          cd packages
          git init -q -b test-build
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Test build from run ${{ inputs.run_id }} ($GITHUB_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" test-build
